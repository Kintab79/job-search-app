name: Release APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk job-search-assistant.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: مساعد البحث عن وظيفة v1.0.0
          body: حمّل ملف job-search-assistant.apk وثبّته على أندرويد (اسمح بالتثبيت من مصدر غير معروف).
          files: job-search-assistant.apk
